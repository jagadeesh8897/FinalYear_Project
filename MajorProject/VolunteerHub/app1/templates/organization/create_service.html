{% extends "base.html" %}
{% block content %}

<style>
body {
    background: linear-gradient(180deg,#f0fdf4,#ffffff);
    font-family: "Segoe UI", sans-serif;
}

.page {
    max-width: 900px;
    margin: auto;
    padding: 40px;
    animation: fadeIn 0.6s ease;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

.form-card {
    background: white;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.08);
}

label {
    font-weight: 600;
    margin-top: 18px;
    display: block;
}

input, textarea {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border-radius: 12px;
    border: 1px solid #d1d5db;
    font-size: 15px;
}

textarea {
    resize: none;
    height: 110px;
}

button {
    margin-top: 30px;
    width: 100%;
    padding: 15px;
    background: linear-gradient(90deg,#22c55e,#16a34a);
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(34,197,94,0.4);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style>
<div class="page">
    <h1>📝 Create New Service</h1>

    <div class="form-card">
        <form method="post" enctype="multipart/form-data">

            {% csrf_token %}
             
            


            <label>📌 Service Title</label>
            <input type="text" name="title" required>

            <label>📝 Description</label>
            <textarea name="description" required></textarea>

            <label>📍 Location</label>
            <input type="text" name="location" required>

            <label>📅 Start Date</label>
            <input type="date" name="start_date" required>

            <label>📅 End Date</label>
            <input type="date" name="end_date" required>
<p id="durationText" style="margin-top:10px;color:#16a34a;font-weight:600;"></p>

<script>
const startInput = document.querySelector("input[name='start_date']");
const endInput = document.querySelector("input[name='end_date']");
const durationText = document.getElementById("durationText");

function calculateDays(){
    if(startInput.value && endInput.value){
        const start = new Date(startInput.value);
        const end = new Date(endInput.value);
        const diff = (end - start) / (1000 * 60 * 60 * 24) + 1;

        if(diff > 0){
            durationText.innerText = "Event Duration: " + diff + " day(s)";
        }
    }
}

startInput.addEventListener("change", calculateDays);
endInput.addEventListener("change", calculateDays);
</script>
<label>🏷 Event Type</label>
<select name="event_type">
    <option>Environmental</option>
    <option>Technical</option>
    <option>Healthcare</option>
    <option>Social</option>
</select>


            <label>👥 Required Volunteers</label>
            <input type="number" name="required_volunteers" required>

            <label>Preferred Gender</label>
<select name="required_gender">
    <option value="ANY">Any</option>
    <option value="MALE">Male</option>
    <option value="FEMALE">Female</option>
</select>

<label>Preferred Year</label>
<select name="required_year">
    <option value="">Any Year</option>
    <option value="1st Year">1st Year</option>
    <option value="2nd Year">2nd Year</option>
    <option value="3rd Year">3rd Year</option>
    <option value="4th Year">4th Year</option>
</select>
<label>👥 Number of Coordinators</label>
<input type="number" name="coord_count" id="coord_count" min="0" max="10">

<div id="coordinator_fields"></div>

            <!-- AUTHORIZATION LETTER -->
<label>📄 Authorization Letter (PDF / Image)</label>
<input type="file"
       name="authorization_letter"
       accept=".pdf,.jpg,.jpeg,.png"
       required>


            <button type="submit">🚀 Submit for Admin Approval</button>
        </form>
    </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function(){

    const startInput = document.querySelector("input[name='start_date']");
    const endInput = document.querySelector("input[name='end_date']");
    const durationText = document.getElementById("durationText");

    function calculateDays(){
        if(startInput.value && endInput.value){
            const start = new Date(startInput.value);
            const end = new Date(endInput.value);
            const diff = (end - start) / (1000 * 60 * 60 * 24) + 1;

            if(diff > 0){
                durationText.innerText = "Event Duration: " + diff + " day(s)";
            }
        }
    }

    startInput.addEventListener("change", calculateDays);
    endInput.addEventListener("change", calculateDays);


    // Coordinator logic
    const countInput = document.getElementById("coord_count");
    const container = document.getElementById("coordinator_fields");

    countInput.addEventListener("change", function() {
        container.innerHTML = "";
        const count = parseInt(this.value);

        for(let i = 1; i <= count; i++) {
            container.innerHTML += `
                <div style="margin-top:15px;">
                    <label>Coordinator ${i} Name</label>
                    <input type="text" name="coord_name_${i}" >

                    <label>Coordinator ${i} Phone</label>
                    <input type="text" name="coord_phone_${i}">
                </div>
            `;
        }
    });

});
</script>
{% endblock %}
