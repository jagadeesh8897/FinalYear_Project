
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Organization Panel</title>
    <style>
body{
    margin:0;
    font-family: 'Poppins', system-ui, sans-serif;
    background:#f5efe6;
    color:#3e2c23;
}

/* ===== MAIN PAGE WRAPPER ===== */
.page{
    padding:30px 50px;
}

/* ===== BREADCRUMB WRAPPER ===== */
.breadcrumb-wrapper{
    padding:18px 30px;
    background:#ffffff;
    border-radius:16px;
    margin-bottom:25px;
    border:1px solid #e6dccf;
    box-shadow:0 8px 20px rgba(111,78,55,0.06);
}

/* ===== BREADCRUMB LAYOUT ===== */
.breadcrumb{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    font-size:15px;
}

/* ===== LINKS ===== */
.breadcrumb-link{
    text-decoration:none;
    color:#6f4e37;
    font-weight:500;
    transition:0.3s;
}

.breadcrumb-link:hover{
    color:#8b5e3c;
}

/* ===== SEPARATOR ===== */
.breadcrumb-separator{
    margin:0 8px;
    color:#a38f7b;
}

/* ===== CURRENT PAGE ===== */
.breadcrumb-current{
    font-weight:600;
    color:#3e2c23;
}
</style>
</head>
<body>
{% include "includes/auto_breadcrumbs.html" %}
<div class="page">
    {% block content %}{% endblock %}
</div>

</body>
</html>
