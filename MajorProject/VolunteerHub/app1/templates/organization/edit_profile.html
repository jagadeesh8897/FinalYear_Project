{% extends "base.html" %}
{% block content %}

<style>
body{
    background: linear-gradient(135deg,#0f172a,#1e293b);
    font-family: 'Segoe UI', sans-serif;
    color:#e2e8f0;
}

/* ===== CONTAINER ===== */
.edit-wrapper{
    max-width:1000px;
    margin:50px auto;
}

/* ===== CARD ===== */
.edit-card{
    background:#1e293b;
    padding:45px;
    border-radius:22px;
    box-shadow:0 25px 60px rgba(0,0,0,.6);
}

/* ===== TITLE ===== */
.edit-title{
    font-size:30px;
    font-weight:700;
    margin-bottom:30px;
    color:#ffffff;
}

/* ===== GRID ===== */
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

/* Full width fields */
.full{
    grid-column:1 / -1;
}

label{
    font-weight:600;
    margin-bottom:6px;
    display:block;
    color:#cbd5e1;
}

input,
textarea{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
    transition:.3s;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#6366f1;
    box-shadow:0 0 0 2px rgba(99,102,241,.3);
}

/* Image preview */
.preview{
    margin-top:10px;
}

.preview img{
    width:100%;
    max-height:160px;
    object-fit:cover;
    border-radius:12px;
    border:2px solid #334155;
}

/* Button */
.save-btn{
    margin-top:25px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    border:none;
    padding:14px 28px;
    border-radius:12px;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:.3s ease;
}

.save-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(99,102,241,.6);
}
</style>

<div class="edit-wrapper">
    <div class="edit-card">

        <div class="edit-title">✨ Edit Organization Profile</div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-grid">

                <!-- Name -->
                <div class="full">
                    <label>Organization Name</label>
                    <input type="text" name="organization_name"
                           value="{{ organization.organization_name }}" required>
                </div>

                <!-- About -->
                <div class="full">
                    <label>About</label>
                    <textarea name="about" rows="4">{{ organization.about }}</textarea>
                </div>

                <!-- Mission -->
                <div>
                    <label>Mission</label>
                    <textarea name="mission" rows="3">{{ organization.mission }}</textarea>
                </div>

                <!-- Vision -->
                <div>
                    <label>Vision</label>
                    <textarea name="vision" rows="3">{{ organization.vision }}</textarea>
                </div>

                <!-- Promo Video -->
                <div class="full">
                    <label>YouTube Promo Video ID</label>
                    <input type="text" name="promo_video"
                           value="{{ organization.promo_video }}">
                </div>
               <label>Website</label>
<input type="text" name="website" value="{{ organization.website }}">

                <!-- Cover Image -->
                <div>
                    <label>Cover Image</label>
                    <input type="file" name="cover_image">
                    {% if organization.cover_image %}
                    <div class="preview">
                        <img src="{{ organization.cover_image.url }}">
                    </div>
                    {% endif %}
                </div>

                <!-- Logo -->
                <div>
                    <label>Logo</label>
                    <input type="file" name="logo">
                    {% if organization.logo %}
                    <div class="preview">
                        <img src="{{ organization.logo.url }}">
                    </div>
                    {% endif %}
                </div>

            </div>

            <button type="submit" class="save-btn">
                Save Changes
            </button>

        </form>

    </div>
</div>

{% endblock %}
