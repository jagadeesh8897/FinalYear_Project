{% extends "base.html" %}
{% block content %}

<style>

body{
    background:#f5efe6;
    font-family:'Poppins', sans-serif;
    color:#3e2c23;
}

/* ===== CONTAINER ===== */
.edit-wrapper{
    max-width:1000px;
    margin:50px auto;
}

/* ===== CARD ===== */
.edit-card{
    background:#ffffff;
    padding:45px;
    border-radius:22px;
    border:1px solid #e6dccf;
    box-shadow:0 25px 60px rgba(111,78,55,.12);
}

/* ===== TITLE ===== */
.edit-title{
    font-size:30px;
    font-weight:700;
    margin-bottom:30px;
    color:#b8824d;
}

/* ===== GRID ===== */
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

/* Full width fields */
.full{
    grid-column:1 / -1;
}

label{
    font-weight:600;
    margin-bottom:6px;
    display:block;
    color:#3e2c23;
}

/* ===== INPUTS ===== */
input,
textarea{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #e6dccf;
    background:#faf8f4;
    color:#3e2c23;
    transition:.3s;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#6f4e37;
    box-shadow:0 0 0 2px rgba(111,78,55,.15);
}

/* ===== IMAGE PREVIEW ===== */
.preview{
    margin-top:10px;
}

.preview img{
    width:100%;
    max-height:160px;
    object-fit:cover;
    border-radius:12px;
    border:2px solid #e6dccf;
}

/* ===== BUTTON ===== */
.save-btn{
    margin-top:30px;
    background:#e3d8d1;
    border:none;
    padding:14px 28px;
    border-radius:14px;
    color:rgb(114, 36, 36);
    font-weight:600;
    cursor:pointer;
    transition:.3s ease;
}

.save-btn:hover{
    background:#f3ece7;
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(111,78,55,.30);
}

</style>

<div class="edit-wrapper">
    <div class="edit-card">

        <div class="edit-title">✨ Edit Organization Profile</div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-grid">

                <!-- Name -->
                <div class="full">
                    <label>Organization Name</label>
                    <input type="text" name="organization_name"
                           value="{{ organization.organization_name }}" required>
                </div>

                <!-- About -->
                <div class="full">
                    <label>About</label>
                    <textarea name="about" rows="4">{{ organization.about }}</textarea>
                </div>

                <!-- Mission -->
                <div>
                    <label>Mission</label>
                    <textarea name="mission" rows="3">{{ organization.mission }}</textarea>
                </div>

                <!-- Vision -->
                <div>
                    <label>Vision</label>
                    <textarea name="vision" rows="3">{{ organization.vision }}</textarea>
                </div>

                <!-- Promo Video -->
                <div class="full">
                    <label>YouTube Promo Video ID</label>
                    <input type="text" name="promo_video"
                           value="{{ organization.promo_video }}">
                </div>
               <label>Website</label>
<input type="text" name="website" value="{{ organization.website }}">

                <!-- Cover Image -->
                <div>
                    <label>Cover Image</label>
                    <input type="file" name="cover_image">
                    {% if organization.cover_image %}
                    <div class="preview">
                        <img src="{{ organization.cover_image.url }}">
                    </div>
                    {% endif %}
                </div>

                <!-- Logo -->
                <div>
                    <label>Logo</label>
                    <input type="file" name="logo">
                    {% if organization.logo %}
                    <div class="preview">
                        <img src="{{ organization.logo.url }}">
                    </div>
                    {% endif %}
                </div>

            </div>

            <button type="submit" class="save-btn">
                Save Changes
            </button>

        </form>

    </div>
</div>

{% endblock %}
