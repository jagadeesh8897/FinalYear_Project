{% extends "base.html" %}
{% block content %}

<div style="max-width:600px;margin:40px auto;background:white;padding:30px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.05);">

    <h2>Edit Profile</h2>
    <hr>

    <form method="post">
        {% csrf_token %}

        <label>Organization Name</label><br>
        <input type="text"
               name="organization_name"
               value="{{ organization.organization_name }}"
               style="width:100%;padding:10px;margin-bottom:15px;border:1px solid #ddd;border-radius:6px;"
               required>

        <button type="submit"
                style="background:#4f46e5;color:white;padding:10px 18px;border:none;border-radius:6px;">
            Save Changes
        </button>

    </form>

</div>

{% endblock %}
