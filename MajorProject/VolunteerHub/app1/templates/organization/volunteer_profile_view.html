<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Volunteer Profile</title>

<style>
body{
    background:#f5efe6;
    font-family:'Poppins',system-ui,sans-serif;
    margin:0;
    padding:40px;
    color:#3e2c23;
}

.card{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:24px;
    padding:35px;
    border:1px solid #e6dccf;
    box-shadow:0 25px 60px rgba(111,78,55,.12);
}

/* ===== HEADER ===== */
.header{
    display:flex;
    align-items:center;
    gap:20px;
}

/* Avatar */
.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#e8dccb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    font-weight:700;
    color:#6f4e37;
    box-shadow:0 10px 25px rgba(111,78,55,.2);
}

.name{
    font-size:28px;
    font-weight:700;
    color:#6f4e37;
}

.meta{
    color:#7c6a58;
    margin-top:6px;
    font-size:15px;
}

/* ===== SECTIONS ===== */
.section{
    margin-top:35px;
}

.section h3{
    margin-bottom:10px;
    color:#6f4e37;
    font-size:18px;
}

.section p{
    color:#7c6a58;
}

/* ===== SKILLS ===== */
.skills span{
    display:inline-block;
    background:#faf8f4;
    color:#6f4e37;
    padding:8px 16px;
    border-radius:20px;
    font-size:14px;
    margin:6px 6px 0 0;
    border:1px solid #e6dccf;
    transition:0.3s;
}

.skills span:hover{
    background:#e8dccb;
}

/* ===== BACK LINK ===== */
.back{
    display:inline-block;
    margin-top:30px;
    text-decoration:none;
    color:#6f4e37;
    font-weight:600;
    transition:0.3s;
}

.back:hover{
    color:#8b5e3c;
}
</style>
</head>

<body>

<div class="card">

    <!-- HEADER -->
    <div class="header">
        <div class="avatar">
            {{ volunteer.full_name|slice:":1" }}
        </div>

        <div>
            <div class="name">{{ volunteer.full_name }}</div>
            <div class="meta">
                {{ volunteer.year }} · {{ volunteer.department }}
            </div>
        </div>
    </div>

    <!-- DETAILS -->
    <div class="section">
        <h3>Contact</h3>
        <p><b>Email:</b> {{ volunteer.user.email }}</p>
        <p><b>Phone:</b> {{ volunteer.phone }}</p>
    </div>

    <div class="section">
        <h3>Skills</h3>
        <div class="skills">
            {% for skill in volunteer.skills_list %}
                <span>{{ skill }}</span>
            {% endfor %}
        </div>
    </div>

    <a href="javascript:history.back()" class="back">← Back to Applicants</a>

</div>

</body>
</html>
