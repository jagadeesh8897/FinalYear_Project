{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Volunteer Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/volunteer_dashboard.css' %}">
    <style>

/* ================= GLOBAL ================= */
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#f5efe6;
    color:#3e2c23;
}

.app{
    display:flex;
    min-height:100vh;
}

/* ================= SIDEBAR ================= */
.sidebar{
    width:260px;
    background:#6f4e37;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:25px 20px;
}

/* Logo */
.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:700;
}

.logo-icon{
    width:36px;
    height:36px;
    border-radius:10px;
    background:#f5efe6;
    color:#6f4e37;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

/* Profile Box */
.profile-box{
    margin:30px 0;
    padding:15px;
    background:rgba(255,255,255,.08);
    border-radius:14px;
}

/* Menu */
.menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu a{
    text-decoration:none;
    color:#f5efe6;
    padding:10px 14px;
    border-radius:12px;
    transition:0.3s ease;
    font-weight:500;
}

.menu a:hover{
    background:#8b5e3c;
}

.menu a.active{
    background:#f5efe6;
    color:#6f4e37;
    font-weight:600;
}

/* Sidebar Footer */
.sidebar-footer{
    margin-top:30px;
}

.logout{
    text-decoration:none;
    color:white;
    padding:10px 14px;
    border-radius:12px;
    display:block;
    background:#a94442;
    text-align:center;
    transition:0.3s;
}

.logout:hover{
    background:#c05250;
}

/* ================= MAIN ================= */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* ================= TOPBAR ================= */
.topbar{
    background:white;
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #e6dccf;
}

.topbar h2{
    margin:0;
    color:#6f4e37;
}

/* ================= NOTIFICATIONS ================= */
.notification-wrapper{
    position:relative;
}

.bell{
    cursor:pointer;
    font-size:20px;
    position:relative;
}

.notif-count{
    position:absolute;
    top:-6px;
    right:-8px;
    background:#a94442;
    color:white;
    font-size:12px;
    padding:2px 6px;
    border-radius:50%;
}

.notif-dropdown{
    position:absolute;
    right:0;
    top:35px;
    width:320px;
    background:white;
    border-radius:16px;
    box-shadow:0 20px 50px rgba(111,78,55,.2);
    display:none;
    max-height:400px;
    overflow-y:auto;
    border:1px solid #e6dccf;
}

.notif-item{
    padding:14px 16px;
    border-bottom:1px solid #f1ebe2;
    cursor:pointer;
    transition:0.3s;
}

.notif-item:hover{
    background:#faf8f4;
}

.notif-item.unread{
    background:#f5efe6;
    font-weight:600;
}

.notif-item small{
    display:block;
    margin-top:4px;
    font-size:12px;
    color:#7c6a58;
}

/* ================= CONTENT ================= */
.content{
    padding:30px;
}

</style>
</head>
<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">V</div>
            <span>VolunteerHub</span>
        </div>

        <div class="profile-box">
            <div>
                <h4>👤 {{ request.user.username }}</h4>
                <p >    Volunteer</p>
            </div>
        </div>
<nav class="menu">

    <a href="/volunteer/dashboard/"
       class="{% if active_page == 'dashboard' %}active{% endif %}">
        Dashboard
    </a>

    <a href="{% url 'volunteer_available_services' %}"
       class="{% if active_page == 'services' %}active{% endif %}">
        Available Services
    </a>

    <a href="/volunteer/applications/"
       class="{% if active_page == 'applications' %}active{% endif %}">
        My Services
    </a>

    <a href="/volunteer/attendance/"

        class="{% if active_page == 'volunteer_attendance' %} active {%endif %}">
        My Attendance
    </a>

    <a href="{% url 'volunteer_profile' %}"
       class="{% if active_page == 'profile' %}active{% endif %}">
        Profile
    </a>

</nav>


        <div class="sidebar-footer">

            <a class="logout" href="{% url 'logout' %}">⎋ Logout</a>

        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <header class="topbar">
            <h2>Volunteer Dashboard</h2>
            <div class="notification-wrapper">
    <div class="bell" onclick="toggleNotifications()">
        🔔
        <span id="notifCount" class="notif-count">0</span>
    </div>

    <div id="notifDropdown" class="notif-dropdown"></div>
</div>
        </header>

        <section class="content">
            {% block content %}

            {% endblock %}
        </section>

    </main>

</div>
<script>

function toggleNotifications() {
    const dropdown = document.getElementById("notifDropdown");
    dropdown.style.display =
        dropdown.style.display === "block" ? "none" : "block";

    loadNotifications();
}

function loadNotifications() {
    fetch("/notifications/")
    .then(res => res.json())
    .then(data => {

        const dropdown = document.getElementById("notifDropdown");
        dropdown.innerHTML = "";

        document.getElementById("notifCount").innerText = data.unread_count;

        if (data.notifications.length === 0) {
            dropdown.innerHTML = "<div style='padding:15px;'>No notifications</div>";
            return;
        }

        data.notifications.forEach(n => {
            const item = document.createElement("div");
            item.className = "notif-item " + (n.is_read ? "" : "unread");

            item.innerHTML = `
                <div>${n.title}</div>
                <div>${n.message}</div>
                <small>${n.created_at}</small>
            `;

            item.onclick = () => {
                markAsRead(n.id);
                if(n.link){
                    window.location.href = n.link;
                }
            };

            dropdown.appendChild(item);
        });
    });
}

function markAsRead(id) {
    fetch(`/notifications/read/${id}/`)
    .then(() => loadNotifications());
}

/* Close when clicking outside */
document.addEventListener("click", function(event) {
    const wrapper = document.querySelector(".notification-wrapper");

    if (!wrapper) return;

    if (!wrapper.contains(event.target)) {
        document.getElementById("notifDropdown").style.display = "none";
    }
});
    document.addEventListener("DOMContentLoaded", function() {
    loadNotifications();
});

</script>

</body>
</html>
